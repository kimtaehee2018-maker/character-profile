<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자캐 & 세계관 설정 아카이브</title>
    <!-- Chart.js 라이브러리 (스탯 그래프용)[cite: 1] -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==========================================================================
           1. 기본 디자인 & Dynamic 테마 변수[cite: 1]
           ========================================================================== */
        :root[data-theme="dark"] {
            --bg-main: #191919;
            --bg-sidebar: #202020;
            --bg-card: #252525;
            --bg-hover: #2c2c2c;
            --bg-input: #1e1e1e;
            --border-color: #333333;
            --accent-color: #7c4dff;
            --accent-hover: #651fff;
            --accent-rgb: 124, 77, 255;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --text-header: #ffffff;
            --danger-color: #f44336;
            --grid-color: rgba(255, 255, 255, 0.08);
        }

        :root[data-theme="light"] {
            --bg-main: #f5f6f8;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f2f5;
            --bg-input: #ffffff;
            --border-color: #e1e4e8;
            --accent-color: #6200ee;
            --accent-hover: #3700b3;
            --accent-rgb: 98, 0, 238;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --text-header: #1a252f;
            --danger-color: #d32f2f;
            --grid-color: rgba(0, 0, 0, 0.06);
        }

        :root[data-theme="purple"] {
            --bg-main: #13091f;
            --bg-sidebar: #1c0d30;
            --bg-card: #25123e;
            --bg-hover: #321852;
            --bg-input: #170a28;
            --border-color: #3d1c63;
            --accent-color: #d042ff;
            --accent-hover: #b800ff;
            --accent-rgb: 208, 66, 255;
            --text-main: #ebd9fc;
            --text-muted: #a382c4;
            --text-header: #ffffff;
            --danger-color: #ff3366;
            --grid-color: rgba(208, 66, 255, 0.1);
        }

        :root[data-theme="blue"] {
            --bg-main: #0b1325;
            --bg-sidebar: #101b33;
            --bg-card: #172647;
            --bg-hover: #1f325c;
            --bg-input: #0e182e;
            --border-color: #233b6e;
            --accent-color: #00b0ff;
            --accent-hover: #0091ea;
            --accent-rgb: 0, 176, 255;
            --text-main: #d0e8ff;
            --text-muted: #78a2cc;
            --text-header: #ffffff;
            --danger-color: #ff5252;
            --grid-color: rgba(0, 176, 255, 0.1);
        }

        :root[data-theme="green"] {
            --bg-main: #0a1813;
            --bg-sidebar: #0f231c;
            --bg-card: #153127;
            --bg-hover: #1d4235;
            --bg-input: #0c1e18;
            --border-color: #234f3f;
            --accent-color: #00e676;
            --accent-hover: #00c853;
            --accent-rgb: 0, 230, 118;
            --text-main: #d1f7e3;
            --text-muted: #72b392;
            --text-header: #ffffff;
            --danger-color: #ff5252;
            --grid-color: rgba(0, 230, 118, 0.1);
        }

        :root {
            --sidebar-width: 300px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        button {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--bg-hover);
            border-color: var(--accent-color);
        }

        button.primary {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.danger {
            background-color: transparent;
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        button.danger:hover {
            background-color: var(--danger-color);
            color: #fff;
        }

        input[type="text"], input[type="url"], select {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-color);
        }

        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 16px;
            color: var(--text-header);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .theme-select-box {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .theme-select-box select {
            padding: 4px 8px;
            font-size: 12px;
        }

        .search-box {
            margin-bottom: 8px;
        }

        .tag-filter-box {
            margin-bottom: 10px;
            background: var(--bg-input);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tag-filter-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .tag-filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 70px;
            overflow-y: auto;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tag-badge:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .tag-badge.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .character-tags-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .backup-controls {
            display: flex;
            gap: 6px;
        }

        .backup-controls button {
            flex: 1;
            font-size: 11px;
            padding: 4px;
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            position: relative;
        }

        .tree-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .tree-item.active {
            background-color: rgba(var(--accent-rgb), 0.15);
            color: var(--accent-color);
            font-weight: bold;
        }

        .tree-item .toggle-icon {
            width: 16px;
            display: inline-block;
            text-align: center;
            margin-right: 4px;
            font-size: 10px;
        }

        .tree-item .item-icon {
            margin-right: 6px;
            font-size: 14px;
        }

        .tree-children {
            display: none;
            padding-left: 16px;
        }

        .tree-children.open {
            display: block;
        }

        .tree-actions {
            margin-left: auto;
            display: none;
            gap: 4px;
        }

        .tree-item:hover .tree-actions {
            display: flex;
        }

        .tree-actions button {
            padding: 1px 4px;
            font-size: 10px;
            line-height: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
        }

        .tree-actions button:hover {
            color: var(--text-header);
        }

        .add-root-btn {
            margin: 10px 16px;
            padding: 8px;
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            text-align: center;
            width: calc(100% - 32px);
        }

        .add-root-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .palette-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 10px;
        }

        .palette-swatch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .palette-swatch:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .palette-swatch.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.6);
        }

        .palette-swatch .color-box {
            width: 44px;
            height: 44px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .palette-swatch .color-hex {
            font-size: 11px;
            font-family: monospace;
            color: var(--text-main);
            font-weight: bold;
        }

        #main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .editor-container {
            width: 100%;
            max-width: 850px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .character-header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
        }

        .character-main-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .character-name-input {
            font-size: 28px;
            font-weight: bold;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            border-radius: 0;
            padding: 4px 0;
            color: var(--text-header);
        }

        .character-name-input:focus {
            border-color: var(--accent-color);
        }

        .image-gallery-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .image-card {
            width: 120px;
            height: 150px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .image-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .image-card .delete-img-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--danger-color);
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-card:hover .delete-img-btn {
            opacity: 1;
        }

        .add-image-card {
            width: 120px;
            height: 150px;
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            gap: 6px;
            transition: all 0.2s;
        }

        .add-image-card:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .section-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-toolbar {
            display: flex;
            gap: 4px;
            padding: 6px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .editor-toolbar button {
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: 28px;
        }

        .editor-toolbar input[type="color"] {
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            background: transparent;
        }

        .rich-editor-content {
            min-height: 120px;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 0 0 4px 4px;
            padding: 12px;
            outline: none;
            line-height: 1.6;
            font-size: 14px;
            overflow-y: auto;
        }

        .rich-editor-content:focus {
            border-color: var(--accent-color);
        }

        .rich-editor-content ul, .rich-editor-content ol {
            padding-left: 20px;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stats-sliders {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .stat-control label {
            width: 80px;
            color: var(--text-main);
        }

        .stat-control input[type="range"] {
            flex: 1;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .stat-control span {
            width: 30px;
            text-align: right;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stats-chart-wrapper {
            width: 280px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .char-relation-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .char-relation-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 13px;
        }
        .char-relation-item b {
            color: var(--accent-color);
        }

        .relation-view {
            width: 100%;
            height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .relation-toolbar {
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px 6px 0 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .zoom-controls {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-left: auto;
        }

        .zoom-controls button {
            padding: 3px 8px;
            font-size: 12px;
        }

        .zoom-level-text {
            font-size: 12px;
            color: var(--text-muted);
            width: 45px;
            text-align: center;
        }

        .relation-canvas-container {
            flex: 1;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-top: none;
            position: relative;
            overflow: hidden;
            cursor: grab;
            background-image: radial-gradient(var(--grid-color) 1.5px, transparent 0);
            background-size: 20px 20px;
        }

        .relation-canvas-container:active {
            cursor: grabbing;
        }

        .relation-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            pointer-events: none;
        }

        #relation-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: visible;
            pointer-events: auto;
        }

        #relation-nodes {
            pointer-events: auto;
        }

        .relation-node {
            position: absolute;
            width: 110px;
            padding: 8px;
            background: var(--bg-card);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            text-align: center;
            cursor: move;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            font-size: 12px;
            font-weight: bold;
            color: var(--text-header);
            z-index: 2;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .relation-node.selected {
            border-color: #00e676;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.6);
            transform: scale(1.05);
        }

        .relation-node.dimmed {
            opacity: 0.25;
        }

        .relation-line {
            stroke: var(--accent-color);
            stroke-width: 2.5;
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s, opacity 0.2s;
            opacity: 0.25;
        }

        .relation-line.highlighted {
            opacity: 1;
            stroke-width: 3.5;
            filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.6));
        }

        .relation-line:hover, .relation-line.selected-line {
            stroke: var(--danger-color);
            stroke-width: 4.5;
            opacity: 1;
            filter: drop-shadow(0 0 4px var(--danger-color));
        }

        .relation-text {
            fill: var(--text-main);
            font-size: 12px;
            text-anchor: middle;
            dominant-baseline: central;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            opacity: 0.25;
            transition: opacity 0.2s, fill 0.2s;
            paint-order: stroke fill;
            stroke: var(--bg-main);
            stroke-width: 6px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .relation-text.highlighted {
            opacity: 1;
        }

        .relation-text.selected-text {
            fill: var(--danger-color);
            opacity: 1;
        }

        .hidden { display: none !important; }

        /* ==========================================================================
           [추가] 4. 스마트 인쇄(Print) 및 PDF 내보내기 최적화 (CSS Print Media)
           ========================================================================== */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
            #sidebar, 
            .editor-toolbar, 
            .add-image-card, 
            .delete-img-btn, 
            button, 
            input[type="file"], 
            .theme-select-box, 
            .search-box, 
            .tag-filter-box, 
            .backup-controls, 
            .add-root-btn, 
            .zoom-controls,
            .relation-toolbar {
                display: none !important;
            }
            #main-content {
                padding: 0 !important;
                overflow: visible !important;
                width: 100% !important;
                max-width: 100% !important;
                display: block !important;
            }
            .editor-container {
                max-width: 100% !important;
                width: 100% !important;
            }
            .section-box {
                background-color: #ffffff !important;
                border: 1px solid #dcdcdc !important;
                box-shadow: none !important;
                break-inside: avoid;
                margin-bottom: 20px !important;
                color: #000000 !important;
            }
            .section-title {
                color: #333333 !important;
                border-bottom: 1px solid #eee;
                padding-bottom: 4px;
            }
            input[type="text"].character-name-input {
                border: none !important;
                font-size: 26px !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            .rich-editor-content {
                background-color: transparent !important;
                border: none !important;
                padding: 0 !important;
                color: #111111 !important;
            }
            .image-card {
                border: 1px solid #cccccc !important;
                break-inside: avoid;
            }
            .palette-swatch {
                background-color: #f9f9f9 !important;
                border: 1px solid #ddd !important;
            }
            .palette-swatch .color-hex {
                color: #333333 !important;
            }
            .char-relation-item {
                background: #f9f9f9 !important;
                border: 1px solid #ddd !important;
                color: #000000 !important;
            }
            .char-relation-item b {
                color: #333 !important;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>창작 아카이브</h2>

            <div class="theme-select-box">
                <label for="theme-select">🎨 테마:</label>
                <select id="theme-select" onchange="changeTheme(this.value)">

                <button onclick="exportJSON()">💾 백업 (JSON)</button>

        </div>

        <div id="editor-view" class="editor-container hidden"></div>
    </div>

    <script>
        const STORAGE_KEY = 'CHARACTER_ARCHIVE_DATA_V8';
        const SELECTION_KEY = 'CHARACTER_ARCHIVE_SELECTION_V8';
        const THEME_KEY = 'CHARACTER_ARCHIVE_THEME_V8';
        
        let appData = {
            categories: [
                {
                    id: 'cat_1',
                    name: '1차 자캐',
                    expanded: true,
                    worlds: [
                        {
                            id: 'world_1',
                            name: '마법관리국 세계관',
                            description: '현대 마법사가 존재하는 세계관',
                            expanded: true,
                            characters: [
                                {
                                    id: 'char_1',
                                    name: '엘렌',
                                    tags: ['주연', '집행관', '마법사'],
                                    images: [],
                                    stats: { str: 60, agi: 85, int: 70, vit: 50, dex: 90 },
                                    basicInfo: '24세 / 마법관리국 집행관',
                                    appearance: '<b>흑발 숏컷</b>, 붉은 눈, 제복 차림',
                                    personality: '냉정해 보이지만 <span style="color: #7c4dff;">책임감이 강함</span>.',
                                    setting: '어릴 적 사태로 고아가 되어 집행관으로 자랐다.',
                                    memo: '주요 무기: 스펠건',
                                    palette: [],

                                },
                                {
                                    id: 'char_2',
                                    name: '로안',
                                    tags: ['상사', '조연'],
                                    images: [],
                                    stats: { str: 80, agi: 60, int: 90, vit: 75, dex: 40 },
                                    basicInfo: '27세 / 정보총괄 팀장',
                                    appearance: '금발, 안경 착용',
                                    personality: '온화하지만 속을 알 수 없음.',
                                    setting: '엘렌의 상사이자 보호자 역할.',
                                    memo: '',
                                    palette: [],

                            relations: [
                                { from: 'char_1', to: 'char_2', label: '신뢰 / 상사', dir: 'forward' }

        let currentSelection = { type: null, categoryId: null, worldId: null, characterId: null };
        let currentTheme = 'dark';
        let activeTagFilter = null;
        let selectedRelNodeId = null;
        let selectedRelationIndex = null;
        let statChartInstance = null;

        let panX = 0;
        let panY = 0;
        let zoomScale = 1;
        let isPanning = false;
        let panStartX = 0;
        let panStartY = 0;

        function applyCharacterThemeColor(hexColor) {
            if (!hexColor) {
                resetThemeAccent();
                return;
            }
            const r = parseInt(hexColor.slice(1, 3), 16);
            const g = parseInt(hexColor.slice(3, 5), 16);
            const b = parseInt(hexColor.slice(5, 7), 16);

            document.documentElement.style.setProperty('--accent-color', hexColor);
            document.documentElement.style.setProperty('--accent-hover', hexColor);
            document.documentElement.style.setProperty('--accent-rgb', `${r}, ${g}, ${b}`);
        }

        function resetThemeAccent() {
            document.documentElement.style.removeProperty('--accent-color');
            document.documentElement.style.removeProperty('--accent-hover');
            document.documentElement.style.removeProperty('--accent-rgb');
        }

        function changeTheme(themeName) {
            currentTheme = themeName;
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem(THEME_KEY, themeName);
            
            if (currentSelection.type === 'character' && currentSelection.characterId) {
                const char = getCharacter(currentSelection.categoryId, currentSelection.worldId, currentSelection.characterId);
                if (char) {
                    if (char.themeColor) applyCharacterThemeColor(char.themeColor);
                    else resetThemeAccent();
                    initStatChart(char);
                }
            } else {
                resetThemeAccent();
                if (currentSelection.type === 'world' || currentSelection.type === 'category') {
                    const target = getCurrentTargetGroup();
                    if (target) drawRelationLines(target);
                }
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
            currentTheme = savedTheme;
            document.documentElement.setAttribute('data-theme', savedTheme);
            const selectEl = document.getElementById('theme-select');
            if (selectEl) selectEl.value = savedTheme;
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
                localStorage.setItem(SELECTION_KEY, JSON.stringify(currentSelection));
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014) {
                    alert('⚠️ 브라우저 저장 공간(LocalStorage)이 부족합니다! 이미지 용량이 너무 크거나 많습니다. 불필요한 이미지를 삭제하거나 압축해서 다시 시도해주세요.');
                } else {
                    console.error('데이터 저장 실패:', e);
                }
            }
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                    appData.categories.forEach(cat => {
                        const processChars = (chars) => {
                            chars.forEach(c => {
                                if (!c.images) c.images = [];
                                if (!c.stats) c.stats = { str: 50, agi: 50, int: 50, vit: 50, dex: 50 };
                                if (!c.tags) c.tags = [];
                                if (!c.palette) c.palette = [];
                                if (c.themeColor === undefined) c.themeColor = '';
                            });
                        };
                        processChars(cat.characters || []);
                        (cat.worlds || []).forEach(w => processChars(w.characters || []));
                    });
                } catch (e) {
                    console.error('데이터 복원 실패', e);
                }
            }

            const savedSelection = localStorage.getItem(SELECTION_KEY);
            if (savedSelection) {
                try {
                    currentSelection = JSON.parse(savedSelection);
                } catch (e) {
                    currentSelection = { type: null, categoryId: null, worldId: null, characterId: null };
                }
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `OC_Archive_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveData();
                    renderSidebarTags();
                    renderTree();
                    showEmptyView();
                    alert('데이터를 성공적으로 불러왔습니다.');
                } catch (err) {
                    alert('올바르지 않은 JSON 파일입니다.');
                }
            };
            reader.readAsText(file);
        }

        function extractPaletteFromImage(imgSrc, callback) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const sampleSize = 60;
                canvas.width = sampleSize;
                canvas.height = sampleSize;
                ctx.drawImage(img, 0, 0, sampleSize, sampleSize);

                const imgData = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
                let pixels = [];

                for (let i = 0; i < imgData.length; i += 4) {
                    const r = imgData[i];
                    const g = imgData[i + 1];
                    const b = imgData[i + 2];
                    const a = imgData[i + 3];

                    if (a < 128) continue;

                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const diff = max - min;

                    const isWhiteOrLightGray = (max > 215 && diff < 35) || (r > 240 && g > 240 && b > 240);

                    if (!isWhiteOrLightGray) {
                        pixels.push([r, g, b]);
                    }
                }

                if (pixels.length < 10) {
                    pixels = [];
                    for (let i = 0; i < imgData.length; i += 4) {
                        if (imgData[i + 3] > 128) {
                            pixels.push([imgData[i], imgData[i + 1], imgData[i + 2]]);
                        }
                    }
                }

                if (pixels.length === 0) {
                    callback(['#241D24', '#8A2431', '#D4B39A', '#302D35', '#B9A7A0']);
                    return;
                }

                const k = 5;
                let centroids = [];
                const step = Math.floor(pixels.length / k);
                for (let i = 0; i < k; i++) {
                    centroids.push([...pixels[Math.min(i * step, pixels.length - 1)]]);
                }

                let clusters = Array.from({ length: k }, () => []);

                for (let iter = 0; iter < 12; iter++) {
                    clusters = Array.from({ length: k }, () => []);
                    for (const p of pixels) {
                        let minDist = Infinity;
                        let bestK = 0;
                        for (let c = 0; c < k; c++) {
                            const dist = Math.pow(p[0] - centroids[c][0], 2) +
                                         Math.pow(p[1] - centroids[c][1], 2) +
                                         Math.pow(p[2] - centroids[c][2], 2);
                            if (dist < minDist) {
                                minDist = dist;
                                bestK = c;
                            }
                        }
                        clusters[bestK].push(p);
                    }

                    for (let c = 0; c < k; c++) {
                        if (clusters[c].length > 0) {
                            let rSum = 0, gSum = 0, bSum = 0;
                            for (const p of clusters[c]) {
                                rSum += p[0];
                                gSum += p[1];
                                bSum += p[2];
                            }
                            centroids[c] = [
                                Math.round(rSum / clusters[c].length),
                                Math.round(gSum / clusters[c].length),
                                Math.round(bSum / clusters[c].length)
                            ];
                        }
                    }
                }

                const colorResults = centroids.map((c, idx) => ({
                    color: c,
                    count: clusters[idx].length
                })).sort((a, b) => b.count - a.count);

                const hexColors = colorResults.map(item => {
                    const c = item.color;
                    const toHex = n => n.toString(16).padStart(2, '0').toUpperCase();
                    return `#${toHex(c[0])}${toHex(c[1])}${toHex(c[2])}`;
                });

                callback(hexColors);
            };
            img.onerror = function() {
                alert('이미지 색상 추출에 실패했습니다.');
            };
            img.src = imgSrc;
        }

        function autoExtractCharPalette(catId, worldId, charId) {
            const char = getCharacter(catId, worldId, charId);
            if (!char || !char.images || char.images.length === 0) {
                alert('팔레트를 추출할 캐릭터 이미지가 없습니다. 갤러리에 이미지를 먼저 추가해 주세요.');
                return;
            }

            extractPaletteFromImage(char.images[0], function(colors) {
                char.palette = colors;
                saveData();
                renderCharacterEditor(catId, worldId, charId);
            });
        }

        function setCharThemeColor(catId, worldId, charId, hexColor) {
            const char = getCharacter(catId, worldId, charId);
            if (char) {
                char.themeColor = hexColor;
                saveData();
                applyCharacterThemeColor(hexColor);
                renderCharacterEditor(catId, worldId, charId);
            }
        }

        function resetCharThemeColor(catId, worldId, charId) {
            const char = getCharacter(catId, worldId, charId);
            if (char) {
                char.themeColor = '';
                saveData();
                resetThemeAccent();
                renderCharacterEditor(catId, worldId, charId);
            }
        }

        function getAllTags() {
            const tagsSet = new Set();
            appData.categories.forEach(cat => {
                (cat.characters || []).forEach(c => (c.tags || []).forEach(t => tagsSet.add(t)));
                (cat.worlds || []).forEach(w => {
                    (w.characters || []).forEach(c => (c.tags || []).forEach(t => tagsSet.add(t)));
                });
            });
            return Array.from(tagsSet);
        }

        function renderSidebarTags() {
            const container = document.getElementById('tag-filter-container');
            const resetBtn = document.getElementById('reset-tag-btn');
            if (!container) return;

            const allTags = getAllTags();
            if (allTags.length === 0) {
                container.innerHTML = '<span style="font-size:11px; color:var(--text-muted);">등록된 태그 없음</span>';
                if (resetBtn) resetBtn.classList.add('hidden');
                return;
            }

            if (resetBtn) {
                if (activeTagFilter) resetBtn.classList.remove('hidden');
                else resetBtn.classList.add('hidden');
            }

            container.innerHTML = allTags.map(tag => `
                <span class="tag-badge ${activeTagFilter === tag ? 'active' : ''}" onclick="toggleTagFilter('${escapeHTML(tag)}')">
                    #${escapeHTML(tag)}
                </span>
            `).join('');
        }

        function toggleTagFilter(tag) {
            if (activeTagFilter === tag) {
                activeTagFilter = null;
            } else {
                activeTagFilter = tag;
            }
            renderSidebarTags();
            renderTree(document.getElementById('search-input').value);
        }

        function clearTagFilter() {
            activeTagFilter = null;
            renderSidebarTags();
            renderTree(document.getElementById('search-input').value);
        }

        function addCharTag(catId, worldId, charId, tagText) {
            if (!tagText) return;
            tagText = tagText.trim().replace(/^#/, '');
            if (!tagText) return;

            const char = getCharacter(catId, worldId, charId);
            if (char) {
                if (!char.tags) char.tags = [];
                if (!char.tags.includes(tagText)) {
                    char.tags.push(tagText);
                    saveData();
                    renderSidebarTags();
                    renderCharacterEditor(catId, worldId, charId);
                }
            }
        }

        function removeCharTag(catId, worldId, charId, tagIdx) {
            const char = getCharacter(catId, worldId, charId);
            if (char && char.tags) {
                char.tags.splice(tagIdx, 1);
                saveData();
                renderSidebarTags();
                renderCharacterEditor(catId, worldId, charId);
            }
        }

        function matchesCharacter(char, query) {
            const matchesQuery = !query || char.name.toLowerCase().includes(query.toLowerCase());
            const matchesTag = !activeTagFilter || (char.tags && char.tags.includes(activeTagFilter));
            return matchesQuery && matchesTag;
        }

        function matchesFilterWorld(world, query) {
            query = query ? query.toLowerCase() : '';
            const matchesQuery = query && world.name.toLowerCase().includes(query);
            const hasMatchingChar = (world.characters || []).some(c => matchesCharacter(c, query));
            if (activeTagFilter) return hasMatchingChar;
            return matchesQuery || hasMatchingChar;
        }

        function matchesFilter(category, query) {
            query = query ? query.toLowerCase() : '';
            const matchesQuery = query && category.name.toLowerCase().includes(query);
            const hasMatchingWorld = (category.worlds || []).some(w => matchesFilterWorld(w, query));
            const hasMatchingChar = (category.characters || []).some(c => matchesCharacter(c, query));
            if (activeTagFilter) return hasMatchingWorld || hasMatchingChar;
            return matchesQuery || hasMatchingWorld || hasMatchingChar;
        }

        function renderTree(filterQuery = '') {
            const container = document.getElementById('tree-root');
            container.innerHTML = '';

            appData.categories.forEach(cat => {
                if ((filterQuery || activeTagFilter) && !matchesFilter(cat, filterQuery)) return;

                const catElement = document.createElement('div');
                
                const catHeader = document.createElement('div');
                catHeader.className = `tree-item ${isCurrent('category', cat.id) ? 'active' : ''}`;
                catHeader.innerHTML = `
                    <span class="toggle-icon">${cat.expanded ? '▼' : '▶'}</span>
                    <span class="item-icon">📂</span>
                    <span onclick="selectNode('category', '${cat.id}')">${escapeHTML(cat.name)}</span>
                    <div class="tree-actions">
                        <button onclick="promptAddWorld('${cat.id}')" title="세계관 추가">+🌍</button>
                        <button onclick="promptAddCharacter('${cat.id}', null)" title="자캐 추가">+👤</button>
                        <button onclick="promptEditCategory('${cat.id}')" title="수정">✏️</button>
                        <button onclick="deleteCategory('${cat.id}')" title="삭제">🗑️</button>
                    </div>
                `;
                catHeader.querySelector('.toggle-icon').onclick = (e) => {
                    e.stopPropagation();
                    cat.expanded = !cat.expanded;
                    saveData();
                    renderTree(filterQuery);
                };

                catElement.appendChild(catHeader);

                const childrenContainer = document.createElement('div');
                childrenContainer.className = `tree-children ${cat.expanded || filterQuery || activeTagFilter ? 'open' : ''}`;

                (cat.worlds || []).forEach(world => {
                    if ((filterQuery || activeTagFilter) && !matchesFilterWorld(world, filterQuery)) return;

                    const worldHeader = document.createElement('div');
                    worldHeader.className = `tree-item ${isCurrent('world', cat.id, world.id) ? 'active' : ''}`;
                    worldHeader.innerHTML = `
                        <span class="toggle-icon">${world.expanded ? '▼' : '▶'}</span>
                        <span class="item-icon">🌍</span>
                        <span onclick="selectNode('world', '${cat.id}', '${world.id}')">${escapeHTML(world.name)}</span>
                        <div class="tree-actions">
                            <button onclick="promptAddCharacter('${cat.id}', '${world.id}')" title="자캐 추가">+👤</button>
                            <button onclick="deleteWorld('${cat.id}', '${world.id}')" title="삭제">🗑️</button>
                        </div>
                    `;
                    worldHeader.querySelector('.toggle-icon').onclick = (e) => {
                        e.stopPropagation();
                        world.expanded = !world.expanded;
                        saveData();
                        renderTree(filterQuery);
                    };

                    childrenContainer.appendChild(worldHeader);

                    const worldChildren = document.createElement('div');
                    worldChildren.className = `tree-children ${world.expanded || filterQuery || activeTagFilter ? 'open' : ''}`;

                    (world.characters || []).forEach(char => {
                        if (!matchesCharacter(char, filterQuery)) return;

                        const charItem = document.createElement('div');
                        charItem.className = `tree-item ${isCurrent('character', cat.id, world.id, char.id) ? 'active' : ''}`;
                        charItem.innerHTML = `
                            <span class="item-icon">👤</span>
                            <span onclick="selectNode('character', '${cat.id}', '${world.id}', '${char.id}')">${escapeHTML(char.name)}</span>
                            <div class="tree-actions">
                                <button onclick="deleteCharacter('${cat.id}', '${world.id}', '${char.id}')" title="삭제">🗑️</button>
                            </div>
                        `;
                        worldChildren.appendChild(charItem);
                    });

                    childrenContainer.appendChild(worldChildren);
                });

                (cat.characters || []).forEach(char => {
                    if (!matchesCharacter(char, filterQuery)) return;

                    const charItem = document.createElement('div');
                    charItem.className = `tree-item ${isCurrent('character', cat.id, null, char.id) ? 'active' : ''}`;
                    charItem.innerHTML = `
                        <span class="item-icon">👤</span>
                        <span onclick="selectNode('character', '${cat.id}', null, '${char.id}')">${escapeHTML(char.name)}</span>
                        <div class="tree-actions">
                            <button onclick="deleteCharacter('${cat.id}', null, '${char.id}')" title="삭제">🗑️</button>
                        </div>
                    `;
                    childrenContainer.appendChild(charItem);
                });

                catElement.appendChild(childrenContainer);
                container.appendChild(catElement);
            });
        }

        function isCurrent(type, catId, worldId = null, charId = null) {
            return currentSelection.type === type &&
                   currentSelection.categoryId === catId &&
                   currentSelection.worldId === worldId &&
                   currentSelection.characterId === charId;
        }

        function handleSearch() {
            renderTree(document.getElementById('search-input').value);
        }

        function promptAddCategory() {
            const name = prompt('새 카테고리 이름:');
            if (!name) return;
            appData.categories.push({ id: 'cat_' + Date.now(), name, expanded: true, worlds: [], characters: [], relations: [] });
            saveData();
            renderTree();
        }

        function promptEditCategory(catId) {
            const cat = appData.categories.find(c => c.id === catId);
            if (!cat) return;
            const newName = prompt('카테고리 이름 수정:', cat.name);
            if (newName) {
                cat.name = newName;
                saveData();
                renderTree();
            }
        }

        function deleteCategory(catId) {
            if (!confirm('카테고리와 하위 항목이 모두 삭제됩니다.')) return;
            appData.categories = appData.categories.filter(c => c.id !== catId);
            saveData();
            renderSidebarTags();
            renderTree();
            showEmptyView();
        }

        function promptAddWorld(catId) {
            const cat = appData.categories.find(c => c.id === catId);
            if (!cat) return;
            const name = prompt('새 세계관 이름:');
            if (!name) return;
            if (!cat.worlds) cat.worlds = [];
            cat.worlds.push({ id: 'world_' + Date.now(), name, description: '', expanded: true, characters: [], relations: [] });
            saveData();
            renderTree();
        }

        function deleteWorld(catId, worldId) {
            if (!confirm('세계관과 하위 자캐가 모두 삭제됩니다.')) return;
            const cat = appData.categories.find(c => c.id === catId);
            if (cat) {
                cat.worlds = cat.worlds.filter(w => w.id !== worldId);
                saveData();
                renderSidebarTags();
                renderTree();
                showEmptyView();
            }

        function promptAddCharacter(catId, worldId = null) {
            const name = prompt('새 자캐 이름:');
            if (!name) return;

            const newChar = {
                id: 'char_' + Date.now(),
                name,
                tags: [],
                images: [],
                stats: { str: 50, agi: 50, int: 50, vit: 50, dex: 50 },
                basicInfo: '',
                appearance: '',
                personality: '',
                setting: '',
                memo: '',
                palette: [],
                themeColor: '',
                x: 100 + Math.random() * 200,
                y: 100 + Math.random() * 200
            };

            const cat = appData.categories.find(c => c.id === catId);
            if (worldId) {
                const w = cat.worlds.find(w => w.id === worldId);
                if (!w.characters) w.characters = [];
                w.characters.push(newChar);
            } else {
                if (!cat.characters) cat.characters = [];
                cat.characters.push(newChar);
            }

            saveData();
            renderTree();
            selectNode('character', catId, worldId, newChar.id);
        }

        function deleteCharacter(catId, worldId, charId) {
            if (!confirm('이 자캐를 삭제하시겠습니까?')) return;
            const cat = appData.categories.find(c => c.id === catId);
            if (worldId) {
                const world = cat.worlds.find(w => w.id === worldId);
                world.characters = world.characters.filter(c => c.id !== charId);
            } else {
                cat.characters = cat.characters.filter(c => c.id !== charId);
            }
            saveData();
            renderSidebarTags();
            renderTree();
            showEmptyView();
        }

        function selectNode(type, catId, worldId = null, charId = null) {
            clearRelationSelection();
            currentSelection = { type, categoryId: catId, worldId, characterId: charId };
            saveData();

            renderTree(document.getElementById('search-input').value);

            const editor = document.getElementById('editor-view');
            const empty = document.getElementById('empty-view');
            
            empty.classList.add('hidden');
            editor.classList.remove('hidden');

                const char = getCharacter(catId, worldId, charId);

                    applyCharacterThemeColor(char.themeColor);

                }
                renderCharacterEditor(catId, worldId, charId);

                resetThemeAccent();

                    renderWorldOrCategoryView('world', catId, worldId);
                } else if (type === 'category') {

        function handleMultipleImageUpload(e, catId, worldId, charId) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const char = getCharacter(catId, worldId, charId);
            if (!char) return;

            if (!char.images) char.images = [];

            let readCount = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                        char.images.push(compressedDataUrl);
                        readCount++;

                        if (readCount === files.length) {
                            saveData();
                            renderCharacterEditor(catId, worldId, charId);
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            });

            e.target.value = '';
        }

        function deleteCharacterImage(catId, worldId, charId, imgIdx) {
            if (!confirm('이 이미지를 삭제하시겠습니까?')) return;
            const char = getCharacter(catId, worldId, charId);
            if (char && char.images) {
                char.images.splice(imgIdx, 1);
                saveData();
                renderCharacterEditor(catId, worldId, charId);
            }
        }

        function updateCharData(catId, worldId, charId, field, value) {
            const char = getCharacter(catId, worldId, charId);
            if (char) {
                char[field] = value;
                saveData();
                if (field === 'name') renderTree();
            }
        }

        function updateCharStat(catId, worldId, charId, statKey, val) {
            const char = getCharacter(catId, worldId, charId);
            if (char) {
                if (!char.stats) char.stats = { str: 50, agi: 50, int: 50, vit: 50, dex: 50 };
                
                const numVal = parseInt(val, 10) || 0;
                char.stats[statKey] = numVal;
                
                const label = document.getElementById(`val-${statKey}`);
                if (label) label.innerText = numVal;

                if (statChartInstance) {
                    const keys = ['str', 'agi', 'int', 'vit', 'dex'];
                    const idx = keys.indexOf(statKey);
                    if (idx !== -1) {
                        statChartInstance.data.datasets[0].data[idx] = numVal;
                        statChartInstance.update();
                    }
                }
                
                saveData();
            }
        }

        function initStatChart(char) {
            const ctx = document.getElementById('statChartCanvas');
            if (!ctx) return;

            if (statChartInstance) {
                statChartInstance.destroy();
            }

            const stats = char.stats || { str: 50, agi: 50, int: 50, vit: 50, dex: 50 };
            const computedStyle = getComputedStyle(document.documentElement);
            const accentRGB = computedStyle.getPropertyValue('--accent-rgb').trim() || '124, 77, 255';
            const accentColor = computedStyle.getPropertyValue('--accent-color').trim() || '#7c4dff';
            const textColor = computedStyle.getPropertyValue('--text-main').trim() || '#e0e0e0';

            statChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['근력', '민첩', '지능', '체력', '기술/마력'],
                    datasets: [{
                        label: char.name || '스탯',
                        data: [stats.str, stats.agi, stats.int, stats.vit, stats.dex],
                        backgroundColor: `rgba(${accentRGB}, 0.25)`,
                        borderColor: accentColor,
                        borderWidth: 2,
                        pointBackgroundColor: accentColor,
                        pointBorderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: currentTheme === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(255, 255, 255, 0.15)' },
                            grid: { color: currentTheme === 'light' ? 'rgba(0,0,0,0.1)' : 'rgba(255, 255, 255, 0.15)' },
                            pointLabels: { color: textColor, font: { size: 11, weight: 'bold' } },
                            ticks: { display: false, stepSize: 25 },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
