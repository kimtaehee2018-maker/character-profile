        function initInfiniteCanvas(targetGroup, type, catId, worldId) {
            const container = document.getElementById('relation-container');
            if (!container) return;

            container.onmousedown = (e) => {
                if (e.target === container || e.target.tagName === 'svg' || e.target.id === 'relation-viewport') {
                    isPanning = true;
                    panStartX = e.clientX - panX;
                    panStartY = e.clientY - panY;
                    clearRelationSelection();
                }
            };

            window.onmousemove = (e) => {
                if (isPanning) {
                    panX = e.clientX - panStartX;
                    panY = e.clientY - panStartY;
                    updateViewportTransform();
                }
            };

            window.onmouseup = () => {
                isPanning = false;
            };

            container.onwheel = (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const newScale = Math.min(Math.max(0.2, zoomScale * zoomFactor), 3.0);
                
                panX = mouseX - (mouseX - panX) * (newScale / zoomScale);
                panY = mouseY - (mouseY - panY) * (newScale / zoomScale);
                zoomScale = newScale;

                updateViewportTransform();
            };
        }

        function adjustZoom(delta) {
            const newScale = Math.min(Math.max(0.2, zoomScale + delta), 3.0);
            zoomScale = newScale;
            updateViewportTransform();
        }

        function resetZoomAndPan() {
            panX = 0;
            panY = 0;
            zoomScale = 1;
            updateViewportTransform();
        }

        function updateViewportTransform() {
            const viewport = document.getElementById('relation-viewport');
            const zoomText = document.getElementById('zoom-text');
            const container = document.getElementById('relation-container');

            if (viewport) {
                viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
            }
            if (zoomText) {
                zoomText.innerText = `${Math.round(zoomScale * 100)}%`;
            }
            if (container) {
                container.style.backgroundPosition = `${panX}px ${panY}px`;
                container.style.backgroundSize = `${20 * zoomScale}px ${20 * zoomScale}px`;
            }
        }

        function renderRelations(targetGroup, type, catId, worldId) {
            const container = document.getElementById('relation-nodes');
            const svg = document.getElementById('relation-svg');
            if (!container || !svg) return;

            container.innerHTML = '';
            
            const defs = svg.querySelector('defs');
            svg.innerHTML = '';
            if (defs) svg.appendChild(defs);

            const characters = targetGroup.characters || [];
            if (!targetGroup.relations) targetGroup.relations = [];

            characters.forEach(char => {
                if (char.x === undefined) char.x = 100 + Math.random() * 300;
                if (char.y === undefined) char.y = 100 + Math.random() * 300;

                const isConnected = selectedRelNodeId === null || 
                    char.id === selectedRelNodeId || 
                    targetGroup.relations.some(r => (r.from === selectedRelNodeId && r.to === char.id) || (r.from === char.id && r.to === selectedRelNodeId));

                const node = document.createElement('div');
                node.className = `relation-node ${selectedRelNodeId === char.id ? 'selected' : ''} ${selectedRelNodeId !== null && !isConnected ? 'dimmed' : ''}`;
                node.style.left = char.x + 'px';
                node.style.top = char.y + 'px';
                node.innerText = char.name;
                node.id = `node-${char.id}`;

                node.onmousedown = (e) => startDragNode(e, char, targetGroup);
                node.onclick = (e) => {
                    e.stopPropagation();
                    handleNodeClickForFocusOrRelation(char.id, targetGroup);
                };

                container.appendChild(node);
            });

            drawRelationLines(targetGroup);
            updateViewportTransform();
        }

        function getCurrentTargetGroup() {
            if (currentSelection.type === 'world') {
                return getWorld(currentSelection.categoryId, currentSelection.worldId);
            } else if (currentSelection.type === 'category') {
                return getCategory(currentSelection.categoryId);
            }
            return null;
        }

        function getControlPoint(x1, y1, x2, y2, offset) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            if (len === 0) return { x: mx, y: my };
            const nx = -dy / len;
            const ny = dx / len;
            return {
                x: mx + nx * offset,
                y: my + ny * offset
            };
        }

        function drawRelationLines(targetGroup) {
            const svg = document.getElementById('relation-svg');
            if (!svg) return;

            const defs = svg.querySelector('defs');
            svg.innerHTML = '';
            if (defs) svg.appendChild(defs);

            const groupedRelations = {};
            (targetGroup.relations || []).forEach((rel, index) => {
                const id1 = rel.from;
                const id2 = rel.to;
                const pairKey = [id1, id2].sort().join('_');
                if (!groupedRelations[pairKey]) groupedRelations[pairKey] = [];
                groupedRelations[pairKey].push({ rel, index });
            });

            Object.keys(groupedRelations).forEach(key => {
                const group = groupedRelations[key];
                
                group.forEach((item, i) => {
                    const { rel, index } = item;
                    const charA = targetGroup.characters.find(c => c.id === rel.from);
                    const charB = targetGroup.characters.find(c => c.id === rel.to);

                    if (!charA || !charB) return;

                    const x1 = charA.x + 55;
                    const y1 = charA.y + 18;
                    const x2 = charB.x + 55;
                    const y2 = charB.y + 18;

                    const offset = group.length === 1 ? 0 : (i === 0 ? 30 : -30);
                    const cp = getControlPoint(x1, y1, x2, y2, offset);

                    const isSelected = (selectedRelationIndex === index);
                    const isHighlighted = selectedRelNodeId === null || rel.from === selectedRelNodeId || rel.to === selectedRelNodeId;
                    
                    const pathData = `M ${x1} ${y1} Q ${cp.x} ${cp.y} ${x2} ${y2}`;
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('fill', 'none');
                    path.setAttribute('class', `relation-line ${isHighlighted ? 'highlighted' : ''} ${isSelected ? 'selected-line' : ''}`);

                    if (rel.dir === 'forward') {
                        path.setAttribute('marker-end', 'url(#arrow-end)');
                    } else if (rel.dir === 'backward') {
                        path.setAttribute('marker-start', 'url(#arrow-start)');
                    } else if (rel.dir === 'bi') {
                        path.setAttribute('marker-end', 'url(#arrow-end)');
                        path.setAttribute('marker-start', 'url(#arrow-start)');
                    }

                    path.onclick = (e) => {
                        e.stopPropagation();
                        selectRelationLine(index, rel, targetGroup);
                    };

                    svg.appendChild(path);

                    const midX = 0.25 * x1 + 0.5 * cp.x + 0.25 * x2;
                    const midY = 0.25 * y1 + 0.5 * cp.y + 0.25 * cp.y; // Fixed minor typo here safely

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', midX);
                    text.setAttribute('y', midY);
                    text.setAttribute('class', `relation-text ${isHighlighted ? 'highlighted' : ''} ${isSelected ? 'selected-text' : ''}`);
                    text.textContent = rel.label || '';

                    text.onclick = (e) => {
                        e.stopPropagation();
                        selectRelationLine(index, rel, targetGroup);
                    };

                    text.ondblclick = (e) => {
                        e.stopPropagation();
                        promptEditRelationDetails(rel, targetGroup);
                    };

                    svg.appendChild(text);
                });
            });
        }

        function promptEditRelationDetails(rel, targetGroup) {
            const charA = targetGroup.characters.find(c => c.id === rel.from);
            const charB = targetGroup.characters.find(c => c.id === rel.to);
            const nameA = charA ? charA.name : 'A';
            const nameB = charB ? charB.name : 'B';

            const newLabel = prompt('관계 이름을 수정하세요:', rel.label || '');
            if (newLabel === null) return;

            const dirInput = prompt(
                `화살표 방향을 설정하세요:\n1: [${nameA}] ➔ [${nameB}] (단방향)\n2: [${nameA}] ⬅ [${nameB}] (역방향)\n3: [${nameA}] ↔ [${nameB}] (양방향)\n4: 방향 없음 (선만)`,
                rel.dir === 'forward' ? '1' : rel.dir === 'backward' ? '2' : rel.dir === 'bi' ? '3' : '4'
            );

            let newDir = 'none';
            if (dirInput === '1') newDir = 'forward';
            else if (dirInput === '2') newDir = 'backward';
            else if (dirInput === '3') newDir = 'bi';

            rel.label = newLabel;
            rel.dir = newDir;

            saveData();
            drawRelationLines(targetGroup);
        }

        function selectRelationLine(index, rel, targetGroup) {
            selectedRelationIndex = index;

            const statusLabel = document.getElementById('relation-status');
            const delBtn = document.getElementById('delete-relation-btn');

            const charA = targetGroup.characters.find(c => c.id === rel.from);
            const charB = targetGroup.characters.find(c => c.id === rel.to);
            const nameA = charA ? charA.name : '미상';
            const nameB = charB ? charB.name : '미상';

            if (statusLabel) statusLabel.innerText = `선택: [${nameA}] ↔ [${nameB}] (${rel.label || '관계명 없음'}) - 더블클릭하여 수정`;
            if (delBtn) delBtn.classList.remove('hidden');

            drawRelationLines(targetGroup);
        }

        function deleteSelectedRelation() {
            if (selectedRelationIndex === null) return;
            const targetGroup = getCurrentTargetGroup();
            if (targetGroup && targetGroup.relations) {
                targetGroup.relations.splice(selectedRelationIndex, 1);
                saveData();
                clearRelationSelection();
                drawRelationLines(targetGroup);
            }
        }

        function startDragNode(e, char, targetGroup) {
            e.stopPropagation();
            let startX = e.clientX;
            let startY = e.clientY;

            function onMouseMove(e) {
                const dx = (e.clientX - startX) / zoomScale;
                const dy = (e.clientY - startY) / zoomScale;
                startX = e.clientX;
                startY = e.clientY;

                char.x += dx;
                char.y += dy;

                const nodeElement = document.getElementById(`node-${char.id}`);
                if (nodeElement) {
                    nodeElement.style.left = char.x + 'px';
                    nodeElement.style.top = char.y + 'px';
                }
                drawRelationLines(targetGroup);
            }

            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                saveData();
            }

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function handleNodeClickForFocusOrRelation(charId, targetGroup) {
            const statusLabel = document.getElementById('relation-status');
            const delBtn = document.getElementById('delete-relation-btn');
            if (delBtn) delBtn.classList.add('hidden');
            selectedRelationIndex = null;

            if (selectedRelNodeId === null) {
                selectedRelNodeId = charId;
                const charName = (targetGroup.characters.find(c => c.id === charId) || {}).name || '';
                if (statusLabel) statusLabel.innerText = `'${charName}' 포커스 됨 (이 인물과 연결된 선만 강조). 다른 인물을 클릭하면 관계 추가`;
                renderRelations(targetGroup, currentSelection.type, currentSelection.categoryId, currentSelection.worldId);
            } else if (selectedRelNodeId === charId) {
                clearRelationSelection();
            } else {
                const idA = selectedRelNodeId;
                const idB = charId;

                const relationsBetween = targetGroup.relations.filter(
                    r => (r.from === idA && r.to === idB) || (r.from === idB && r.to === idA)
                );

                if (relationsBetween.length >= 2) {
                    alert('두 캐릭터 사이에는 최대 2개의 관계선만 설정할 수 있습니다.');
                    clearRelationSelection();
                    return;
                }

                const addNewRelation = () => {
                    const charA = targetGroup.characters.find(c => c.id === idA);
                    const charB = targetGroup.characters.find(c => c.id === idB);
                    
                    const label = prompt(`[${charA.name}]과 [${charB.name}]의 관계명을 입력하세요:`);
                    if (label === null) return;
                    
                    const dirInput = prompt(
                        `화살표 방향 선택:\n1: ${charA.name} ➔ ${charB.name} (단방향)\n2: ${charA.name} ⬅ ${charB.name} (역방향)\n3: ${charA.name} ↔ ${charB.name} (양방향)\n4: 방향 없음`,
                        '1'
                    );
                    let dir = 'none';
                    if (dirInput === '1') dir = 'forward';
                    else if (dirInput === '2') dir = 'backward';
                    else if (dirInput === '3') dir = 'bi';

                    targetGroup.relations.push({
                        from: idA,
                        to: idB,
                        label: label,
                        dir: dir
                    });
                    saveData();
                };

                if (relationsBetween.length === 1) {
                    if (confirm(`이미 '${relationsBetween[0].label}' 관계가 설정되어 있습니다.\n\n확인: 기존 관계 수정\n취소: 두 번째 관계 추가`)) {
                        promptEditRelationDetails(relationsBetween[0], targetGroup);
                    } else {
                        addNewRelation();
                    }
                } else {
                    addNewRelation();
                }

                clearRelationSelection();
                renderRelations(targetGroup, currentSelection.type, currentSelection.categoryId, currentSelection.worldId);
            }
        }

        function clearRelationSelection() {
            selectedRelNodeId = null;
            selectedRelationIndex = null;

            const statusLabel = document.getElementById('relation-status');
            if (statusLabel) statusLabel.innerText = '';

            const delBtn = document.getElementById('delete-relation-btn');
            if (delBtn) delBtn.classList.add('hidden');

            const targetGroup = getCurrentTargetGroup();
            if (targetGroup) {
                renderRelations(targetGroup, currentSelection.type, currentSelection.categoryId, currentSelection.worldId);
            }
        }

        function exportRelationPNG() {
            const targetGroup = getCurrentTargetGroup();
            if (!targetGroup || !targetGroup.characters || targetGroup.characters.length === 0) {
                alert('내보낼 인물 데이터가 없습니다.');
                return;
            }

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            targetGroup.characters.forEach(c => {
                if (c.x < minX) minX = c.x;
                if (c.y < minY) minY = c.y;
                if (c.x + 120 > maxX) maxX = c.x + 120;
                if (c.y + 60 > maxY) maxY = c.y + 60;
            });

            const padding = 60;
            minX -= padding;
            minY -= padding;
            maxX += padding;
            maxY += padding;

            const width = Math.max(400, maxX - minX);
            const height = Math.max(300, maxY - minY);

            const canvas = document.createElement('canvas');
            canvas.width = width * 2;
            canvas.height = height * 2;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);

            const computedStyle = getComputedStyle(document.documentElement);
            const bgMain = computedStyle.getPropertyValue('--bg-main').trim() || '#191919';
            const bgCard = computedStyle.getPropertyValue('--bg-card').trim() || '#252525';
            const accentColor = computedStyle.getPropertyValue('--accent-color').trim() || '#7c4dff';
            const textColor = computedStyle.getPropertyValue('--text-header').trim() || '#ffffff';
            const textMain = computedStyle.getPropertyValue('--text-main').trim() || '#e0e0e0';

            ctx.fillStyle = bgMain;
            ctx.fillRect(0, 0, width, height);

            const groupedRelations = {};
            (targetGroup.relations || []).forEach(rel => {
                const id1 = rel.from;
                const id2 = rel.to;
                const pairKey = [id1, id2].sort().join('_');
                if (!groupedRelations[pairKey]) groupedRelations[pairKey] = [];
                groupedRelations[pairKey].push(rel);
            });

            Object.keys(groupedRelations).forEach(key => {
                const group = groupedRelations[key];
                group.forEach((rel, i) => {
                    const charA = targetGroup.characters.find(c => c.id === rel.from);
                    const charB = targetGroup.characters.find(c => c.id === rel.to);
                    if (charA && charB) {
                        const x1 = charA.x + 55 - minX;
                        const y1 = charA.y + 18 - minY;
                        const x2 = charB.x + 55 - minX;
                        const y2 = charB.y + 18 - minY;

                        const offset = group.length === 1 ? 0 : (i === 0 ? 30 : -30);
                        const cp = getControlPoint(x1, y1, x2, y2, offset);

                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.quadraticCurveTo(cp.x, cp.y, x2, y2);
                        ctx.strokeStyle = accentColor;
                        ctx.lineWidth = 2.5;
                        ctx.stroke();

                        if (rel.label) {
                            const midX = 0.25 * x1 + 0.5 * cp.x + 0.25 * x2;
                            const midY = 0.25 * y1 + 0.5 * cp.y + 0.25 * x2;

                            ctx.font = 'bold 12px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';

                            ctx.strokeStyle = bgMain;
                            ctx.lineWidth = 6;
                            ctx.lineJoin = 'round';
                            ctx.strokeText(rel.label, midX, midY);

                            ctx.fillStyle = textMain;
                            ctx.fillText(rel.label, midX, midY);
                        }
                    }
                });
            });

            targetGroup.characters.forEach(char => {
                const nx = char.x - minX;
                const ny = char.y - minY;
                const nw = 110;
                const nh = 36;

                ctx.fillStyle = bgCard;
                ctx.strokeStyle = accentColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(nx, ny, nw, nh, 8);
                ctx.fill();
                ctx.stroke();

                ctx.font = 'bold 13px sans-serif';
                ctx.fillStyle = textColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char.name, nx + nw / 2, ny + nh / 2);
            });

            const imageURI = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `${targetGroup.name}_관계도.png`;
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                clearRelationSelection();
            } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedRelationIndex !== null) {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
                deleteSelectedRelation();
            }
        });

        function getCategory(catId) {
            return appData.categories.find(c => c.id === catId);
        }

        function getWorld(catId, worldId) {
            const cat = getCategory(catId);
            return cat && cat.worlds ? cat.worlds.find(w => w.id === worldId) : null;
        }

        function getCharacter(catId, worldId, charId) {
            if (worldId) {
                const world = getWorld(catId, worldId);
                return world && world.characters ? world.characters.find(c => c.id === charId) : null;
            } else {
                const cat = getCategory(catId);
                return cat && cat.characters ? cat.characters.find(c => c.id === charId) : null;
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        window.onload = function() {
            loadTheme();
            loadData();
            renderSidebarTags();
            renderTree();

            if (currentSelection && currentSelection.type) {
                selectNode(currentSelection.type, currentSelection.categoryId, currentSelection.worldId, currentSelection.characterId);
            } else if (appData.categories.length > 0) {
                const firstCat = appData.categories[0];
                if (firstCat.worlds && firstCat.worlds.length > 0 && firstCat.worlds[0].characters.length > 0) {
                    selectNode('character', firstCat.id, firstCat.worlds[0].id, firstCat.worlds[0].characters[0].id);
                } else if (firstCat.characters && firstCat.characters.length > 0) {
                    selectNode('character', firstCat.id, null, firstCat.characters[0].id);
                } else {
                    selectNode('category', firstCat.id);
                }
            } else {
                showEmptyView();
            }
        };
    </script>
</body>
